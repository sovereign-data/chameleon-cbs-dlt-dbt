# JWT against SQE (Trino protocol). The Chameleon backend overwrites this file
# with the same shape when it runs the project; in Airflow (cosmos) and locally
# the env vars below apply. DBT_ACCESS_TOKEN = a Keycloak access token for SQE.
trino:
  target: dev
  outputs:
    dev:
      type: trino
      method: jwt
      jwt_token: "{{ env_var('DBT_ACCESS_TOKEN', '') }}"
      host: "{{ env_var('SQE_HOST', 'sql.test.sovereign-data.org') }}"
      port: "{{ env_var('SQE_PORT', '443') | int }}"
      http_scheme: "{{ env_var('SQE_HTTP_SCHEME', 'https') }}"
      user: "{{ env_var('DBT_USER', 'dbt') }}"
      database: "{{ env_var('DBT_TARGET_CATALOG', 'main_warehouse') }}"
      # Must exist in the target catalog: SQE resolves the session default
      # schema on every query, and a missing one (404) feeds its catalog
      # circuit breaker. Models still go to their own +schema.
      schema: "{{ env_var('DBT_TARGET_SCHEMA', 'cbs_bronze') }}"
      threads: 4
      retries: 1
      cert: "{{ env_var('SQE_CA_CERT', '') or false }}"
      prepared_statements_enabled: false
