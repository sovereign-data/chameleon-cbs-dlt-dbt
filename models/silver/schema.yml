version: 2
models:
  - name: dim_region
    columns:
      - {name: region_key, tests: [not_null, unique]}
      - name: region_level
        tests:
          - accepted_values: {values: [country, landsdeel, province, municipality, other]}
  - name: dim_dwelling_type
    columns:
      - {name: dwelling_type_key, tests: [not_null, unique]}
  - name: fct_energy_use_yearly
    columns:
      - {name: year, tests: [not_null]}
      - name: region_key
        tests: [not_null, {relationships: {to: ref('dim_region'), field: region_key}}]
  - name: fct_energy_tariff_yearly
    columns:
      - {name: year, tests: [not_null, unique]}
